<style>
:root{--gold:#c8a66b;--goldlight:#ead5ad}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080808;color:#f5f0e8;font-family:Montserrat,Arial,sans-serif;overflow:hidden}#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,#29251f 0%,#11100e 42%,#050505 100%)}#scene{position:absolute;inset:0;width:100%;height:100%;display:block}.grain{pointer-events:none;position:absolute;inset:0;opacity:.12;z-index:2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3E%3C/svg%3E");mix-blend-mode:soft-light}.topbar{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:26px clamp(20px,5vw,76px)}.brand{width:112px;max-height:48px;object-fit:contain;filter:drop-shadow(0 2px 12px #000)}.top-note{color:#c7b99f;font-size:9px;letter-spacing:.28em;text-transform:uppercase}.intro{position:absolute;z-index:4;top:16%;left:50%;width:min(90%,760px);transform:translateX(-50%);text-align:center;pointer-events:none}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.42em;text-transform:uppercase;margin-bottom:17px}h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(48px,7.2vw,104px);line-height:.88;letter-spacing:.015em;text-shadow:0 8px 35px #000}.intro p{margin:20px 0 0;color:#d4cbbd;font-size:clamp(11px,1.15vw,14px);font-weight:300;letter-spacing:.22em;text-transform:uppercase}.instruction{position:absolute;z-index:4;left:50%;bottom:5.5%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;color:#b8aa91;font-size:9px;letter-spacing:.3em;text-transform:uppercase;pointer-events:none;transition:opacity .5s}.line{width:1px;height:38px;background:linear-gradient(transparent,var(--gold));animation:pulse 1.8s infinite ease-in-out}@keyframes pulse{0%,100%{opacity:.35;transform:scaleY(.7)}50%{opacity:1;transform:scaleY(1)}}.hint{position:absolute;z-index:4;right:clamp(20px,5vw,76px);bottom:6%;color:#8d8579;font-size:9px;letter-spacing:.18em;text-transform:uppercase}.selection{position:absolute;z-index:5;left:50%;bottom:11%;transform:translate(-50%,18px);text-align:center;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s}.selection.visible{opacity:1;transform:translate(-50%,0);pointer-events:auto}.selection strong{display:block;color:var(--goldlight);font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(25px,3vw,40px);font-weight:400;letter-spacing:.08em}.selection span{display:block;margin-top:7px;color:#c9c0b2;font-size:9px;letter-spacing:.25em;text-transform:uppercase}.enter{pointer-events:auto;display:inline-block;margin-top:17px;padding:12px 24px;border:1px solid rgba(200,166,107,.7);background:rgba(8,8,8,.55);color:#f1dfbf;font:500 9px Montserrat,sans-serif;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;transition:.25s}.enter:hover{background:var(--gold);color:#100e0a;transform:translateY(-2px)}.footer{position:absolute;z-index:4;left:clamp(20px,5vw,76px);bottom:28px;color:#625d55;font-size:8px;letter-spacing:.18em;text-transform:uppercase}.loading{position:absolute;z-index:10;inset:0;display:grid;place-items:center;background:#080808;transition:opacity .8s,visibility .8s}.loading.hide{opacity:0;visibility:hidden}.loading-inner{text-align:center;color:var(--gold);font-size:9px;letter-spacing:.35em}.loading-bar{width:150px;height:1px;margin:18px auto 0;background:#332a1d;overflow:hidden}.loading-bar:after{content:"";display:block;height:100%;width:40%;background:var(--gold);animation:load 1.2s infinite ease-in-out}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(260%)}}.error{position:absolute;z-index:20;left:50%;bottom:18px;transform:translateX(-50%);width:min(90%,520px);color:#d8c8aa;text-align:center;font-size:11px;line-height:1.6;display:none}
@media(max-width:700px){.topbar{padding-top:18px}.brand{width:88px}.top-note{font-size:7px;letter-spacing:.16em}.intro{top:17%}.intro p{letter-spacing:.13em;line-height:1.8}.hint{display:none}.instruction{bottom:4%;font-size:8px}.selection{bottom:12%;width:90%}.footer{bottom:18px;font-size:7px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><main id="stage"><canvas id="scene"></canvas><div class="grain"></div>
<header class="topbar"><img class="brand" src="logo%20neros.png" alt="NERÓS" onerror="this.style.display='none'"><div class="top-note">Fragancias · Estilo · Experiencias</div></header>
<section class="intro" id="intro"><div class="eyebrow">Una nueva forma de descubrir</div><h1>Bienvenido<br>a NERÓS</h1><p>¿Cuál es tu opción hoy?</p></section>
<div class="instruction" id="instruction"><span>Explorá nuestros espacios</span><div class="line"></div></div><div class="hint">Mové el cursor para explorar</div>
<div class="selection" id="selection"><strong id="selectionTitle">PERFUMES ÁRABES</strong><span id="selectionSubtitle">Descubrí esta colección</span><button class="enter" id="enterButton">Explorar categoría</button></div>
<div class="footer">NERÓS · DISCOVER YOUR NEXT CHOICE</div><div class="loading" id="loading"><div class="loading-inner">NERÓS<div class="loading-bar"></div><div style="margin-top:13px">PREPARANDO EXPERIENCIA</div></div></div><div class="error" id="error"></div></main>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.querySelector('#scene'),intro=document.querySelector('#intro'),instruction=document.querySelector('#instruction'),selection=document.querySelector('#selection'),selectionTitle=document.querySelector('#selectionTitle'),selectionSubtitle=document.querySelector('#selectionSubtitle'),enterButton=document.querySelector('#enterButton'),loading=document.querySelector('#loading'),errorBox=document.querySelector('#error');
const categories=[{title:'PERFUMES ÁRABES',subtitle:'Intensidad · carácter · presencia',slug:'arabes'},{title:'PERFUMES DE DISEÑADOR',subtitle:'Íconos que dejan huella',slug:'disenador'},{title:'PERFUMES DE NICHO',subtitle:'Fragancias fuera de lo común',slug:'nicho'},{title:'ELECTRÓNICA',subtitle:'Tecnología para tu estilo',slug:'electronica'},{title:'MÁS PARA DESCUBRIR',subtitle:'Novedades y próximos lanzamientos',slug:'novedades'}];
let renderer,scene,camera,raycaster,pointer,selected=null,nicheMeshes=[];const mobile=matchMedia('(max-width:700px)').matches;let px=0,py=0;
const clock=new THREE.Clock();
try{init();animate();setTimeout(()=>loading.classList.add('hide'),900)}catch(e){errorBox.style.display='block';errorBox.textContent='No se pudo iniciar la escena 3D. Revisá tu conexión y que el navegador permita WebGL.';loading.classList.add('hide');console.error(e)}
function init(){renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x090807,.035);camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,80);camera.position.set(0,2.25,10.8);camera.lookAt(0,2.25,-2.1);
scene.add(new THREE.AmbientLight(0xc8b99e,.72));const ceiling=new THREE.PointLight(0xffdca8,95,28,2);ceiling.position.set(0,7,3);scene.add(ceiling);const glow=new THREE.PointLight(0xc18c45,34,18,2);glow.position.set(0,3.6,-3.8);scene.add(glow);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x171512,roughness:.34,metalness:.24}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);
const wallGroup=new THREE.Group();wallGroup.position.z=-2.8;scene.add(wallGroup);const wall=new THREE.Mesh(new THREE.BoxGeometry(15,7,.7),new THREE.MeshStandardMaterial({color:0x171613,roughness:.82,metalness:.12}));wall.position.set(0,3.5,0);wall.receiveShadow=true;wallGroup.add(wall);
for(let x=-7.2;x<=7.21;x+=.6){const strip=new THREE.Mesh(new THREE.BoxGeometry(.012,6.8,.012),new THREE.MeshStandardMaterial({color:0x373027,roughness:.65}));strip.position.set(x,3.5,.37);wallGroup.add(strip)}
const spacing=mobile?2.45:2.72,start=-((categories.length-1)*spacing)/2;categories.forEach((cat,i)=>{const item=makeNiche(cat,start+i*spacing,i);wallGroup.add(item.group);nicheMeshes.push(item.hit)});
const sideMat=new THREE.MeshStandardMaterial({color:0x0b0a09,roughness:.9});const side=new THREE.Mesh(new THREE.BoxGeometry(.5,7,15),sideMat);side.position.set(-7.7,3.5,-5.5);scene.add(side);const right=side.clone();right.position.x=7.7;scene.add(right);raycaster=new THREE.Raycaster();pointer=new THREE.Vector2(99,99);addEventListener('pointermove',e=>{px=e.clientX/innerWidth*2-1;py=-(e.clientY/innerHeight)*2+1;pointer.set(px,py)});addEventListener('click',e=>{if(!e.target.closest('button')&&selected)openSelected()});addEventListener('resize',resize);enterButton.addEventListener('click',openSelected);gsap.from(intro,{opacity:0,y:24,duration:1.3,delay:.45,ease:'power3.out'});gsap.from('.topbar',{opacity:0,y:-14,duration:1,delay:.25})}
function makeNiche(cat,x,index){const group=new THREE.Group();group.position.set(x,mobile?2.8:3.1,.43);const frame=new THREE.Mesh(new THREE.BoxGeometry(2.05,3.45,.32),new THREE.MeshStandardMaterial({color:0x242019,roughness:.45,metalness:.28}));frame.position.z=-.08;group.add(frame);const cavity=new THREE.Mesh(new THREE.BoxGeometry(1.78,3.12,.3),new THREE.MeshStandardMaterial({color:0x080807,roughness:.55,metalness:.18}));cavity.position.set(0,0,.105);group.add(cavity);const back=new THREE.Mesh(new THREE.PlaneGeometry(1.72,3.04),new THREE.MeshStandardMaterial({color:0x100f0d,roughness:.75}));back.position.set(0,0,.27);group.add(back);const edge=new THREE.Mesh(new THREE.BoxGeometry(1.88,3.22,.035),new THREE.MeshStandardMaterial({color:0x8c7047,roughness:.32,metalness:.8,transparent:true,opacity:.55}));edge.position.z=.28;group.add(edge);const gold=new THREE.MeshStandardMaterial({color:0x9c7845,roughness:.3,metalness:.72});const shelf=new THREE.Mesh(new THREE.BoxGeometry(1.68,.07,.42),gold);shelf.position.set(0,-.88,.42);group.add(shelf);const light=new THREE.SpotLight(0xffd59a,0,7,Math.PI/5,.65,1.4);light.position.set(0,1.35,1);light.target.position.set(0,-.1,.2);group.add(light,light.target);const bottleGroup=new THREE.Group();bottleGroup.position.set(0,-.15,.58);const bottle=new THREE.Mesh(new THREE.BoxGeometry(.62,1,.28,2,2,2),new THREE.MeshPhysicalMaterial({color:index===3?0xaaa9a4:0x9b784c,metalness:.35,roughness:.18,transparent:true,opacity:.88,clearcoat:1}));bottleGroup.add(bottle);const cap=new THREE.Mesh(new THREE.BoxGeometry(.25,.22,.25),gold);cap.position.y=.59;bottleGroup.add(cap);const label=new THREE.Mesh(new THREE.PlaneGeometry(.42,.3),new THREE.MeshBasicMaterial({color:0x17130e}));label.position.set(0,-.03,.146);bottleGroup.add(label);group.add(bottleGroup);const hit=new THREE.Mesh(new THREE.PlaneGeometry(2.15,3.55),new THREE.MeshBasicMaterial({transparent:true,opacity:.001,side:THREE.DoubleSide}));hit.position.z=.62;hit.userData={category:cat,light,bottle:bottleGroup,group};group.add(hit);return{group,hit}}
function openSelected(){if(!selected)return;location.href=`catalogo.html?categoria=${encodeURIComponent(selected.slug)}`}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))}
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();raycaster.setFromCamera(pointer,camera);const found=raycaster.intersectObjects(nicheMeshes,false),hover=found.length?found[0].object:null;if(hover!==(selected&&selected.hit)){if(selected)setActive(selected.hit,false);if(hover){selected={hit:hover,...hover.userData.category};setActive(hover,true)}else{selected=null;selection.classList.remove('visible')}}nicheMeshes.forEach((hit,i)=>{const active=selected&&selected.hit===hit,{light,bottle,group}=hit.userData;light.intensity+=( (active?85:18)-light.intensity)*.12;bottle.position.y=-.15+Math.sin(t*1.2+i)*.035;bottle.rotation.y=Math.sin(t*.55+i)*.06;const s=active?1.09:1;group.scale.x+=(s-group.scale.x)*.09;group.scale.y+=(s-group.scale.y)*.09});camera.position.x+=(px*(mobile?.18:.42)-camera.position.x)*.025;camera.position.y+=(2.25+py*(mobile?.06:.13)-camera.position.y)*.025;camera.lookAt(0,2.25,-2.1);renderer.render(scene,camera)}
function setActive(hit,on){const cat=hit.userData.category;if(on){selectionTitle.textContent=cat.title;selectionSubtitle.textContent=cat.subtitle;selection.classList.add('visible');instruction.style.opacity='0';gsap.to(intro,{opacity:.22,y:-18,duration:.45,ease:'power2.out'})}else{selection.classList.remove('visible');instruction.style.opacity='1';gsap.to(intro,{opacity:1,y:0,duration:.45,ease:'power2.out'})}}
</script></body></html>
